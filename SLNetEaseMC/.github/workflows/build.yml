name: Build SLNetEaseMC Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: 'theos'

      - name: Download Python-Apple-support
        run: |
          URL=$(curl -s https://api.github.com/repos/beeware/Python-Apple-support/releases/latest \
            | python3 -c "import sys,json;assets=json.load(sys.stdin)['assets'];print(next(a['browser_download_url'] for a in assets if 'iOS' in a['name']))")
          echo "Downloading: $URL"
          curl -L "$URL" -o py.tar.gz
          mkdir -p python-support
          tar -xzf py.tar.gz -C python-support
          XC=$(find python-support -maxdepth 3 -name "Python.xcframework" | head -1)
          echo "PYXC=$XC" >> "$GITHUB_ENV"
          ls "$XC"

      - name: Build
        run: |
          export THEOS=${{ github.workspace }}/theos
          export PYTHON_FRAMEWORK=${{ github.workspace }}/${{ env.PYXC }}/ios-arm64/Python.framework
          make FINALPACKAGE=1 DEBUG=0

      - name: Package zip
        run: |
          DYLIB=$(find .theos/obj -name "SLNetEaseMC.dylib" | head -1)
          echo "dylib: $DYLIB"
          mkdir -p dist/SLNetEaseMC
          cp "$DYLIB" dist/SLNetEaseMC/
          cp -R resources dist/SLNetEaseMC/
          PYFW="${{ github.workspace }}/${{ env.PYXC }}/ios-arm64/Python.framework"
          if [ -d "$PYFW" ]; then
            mkdir -p dist/SLNetEaseMC/Frameworks
            cp -R "$PYFW" dist/SLNetEaseMC/Frameworks/
          fi
          cd dist && zip -q -r SLNetEaseMC.zip SLNetEaseMC
          ls -la SLNetEaseMC.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SLNetEaseMC
          path: dist/SLNetEaseMC.zip
