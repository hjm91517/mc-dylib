name: Unzip and Deploy

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and unzip all ZIP files
        run: |
          shopt -s nullglob
          found=0
          for f in *.zip; do
            echo "解压 $f ..."
            unzip -o "$f" -d .
            rm -f "$f"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "没有找到 ZIP 文件，退出"
            exit 0
          fi
          echo "---- 解压后目录 ----"
          ls -la

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: unzip and deploy"
            git push
          fi
