name: Flatten Folders to Root

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move all files from subfolders to root and delete folders
        run: |
          ROOT="$GITHUB_WORKSPACE"

          # 递归展开：只要根目录下还有子文件夹，就继续把里面的内容搬出来
          while :; do
            moved=0
            for dir in "$ROOT"/*/; do
              [ -d "$dir" ] || continue
              name=$(basename "$dir")
              # 跳过 .git / .github，避免破坏仓库和工作流本身
              [ "$name" = ".git" ] && continue
              [ "$name" = ".github" ] && continue

              echo "展开：$dir"
              shopt -s dotglob
              mv -f "$dir"* "$ROOT"/ 2>/dev/null || true
              shopt -u dotglob

              # 删除已空的文件夹
              rmdir "$dir" 2>/dev/null && echo "已删除：$dir"
              moved=1
            done
            [ "$moved" -eq 0 ] && break
          done

          echo "---- 处理后根目录 ----"
          ls -la "$ROOT"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: flatten folders to root"
            git push
          fi
