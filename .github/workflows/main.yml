name: Build SLNetEaseMC Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 兼容两种仓库结构：文件直接在根目录，或嵌套在 SLNetEaseMC/ 子目录里
      - name: Fix repo layout
        run: |
          set -euo pipefail
          if [ ! -f Makefile ] && [ -f SLNetEaseMC/Makefile ]; then
            echo "检测到文件嵌套在 SLNetEaseMC/ 子目录，移动到根目录"
            shopt -s dotglob
            mv SLNetEaseMC/* .
            rmdir SLNetEaseMC
          fi
          ls -la

      # 不再使用第三方 theos-action（已失修，Get SDKs 阶段会报 theos/sdks is not a directory）
      - name: Install Theos
        run: |
          set -euo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          curl -fL -o sdks.zip https://codeload.github.com/theos/sdks/zip/refs/heads/master
          unzip -q sdks.zip
          cp -R sdks-master/*.sdk "$GITHUB_WORKSPACE/theos/sdks/"
          ls "$GITHUB_WORKSPACE/theos/sdks"

      # 直接下载 BeeWare 预编译的 iOS Python，无需 ./configure 源码编译
      - name: Download Python-Apple-support
        run: |
          set -euo pipefail
          # 优先用 GitHub API 取最新 iOS 资产；API 限流/失败则回退到固定版本
          URL=$(curl -sf https://api.github.com/repos/beeware/Python-Apple-support/releases/latest \
            | python3 -c "import sys,json;assets=json.load(sys.stdin).get('assets',[]);print(next((a['browser_download_url'] for a in assets if 'iOS' in a['name']), ''))" \
            || true)
          if [ -z "$URL" ]; then
            URL="https://github.com/beeware/Python-Apple-support/releases/download/3.11-b5/Python-3.11-iOS-support.b5.tar.gz"
          fi
          echo "Downloading: $URL"
          curl -fL "$URL" -o py.tar.gz
          # 校验下载到的是真压缩包而不是 404 HTML 页
          file py.tar.gz
          mkdir -p python-support
          tar -xzf py.tar.gz -C python-support
          XC=$(find python-support -maxdepth 3 -name "Python.xcframework" | head -1)
          if [ -z "$XC" ]; then
            echo "::error::未找到 Python.xcframework，解压结果如下："
            ls -la python-support
            exit 1
          fi
          echo "PYXC=$XC" >> "$GITHUB_ENV"
          ls "$XC"

      - name: Install ldid
        run: |
          set -euo pipefail
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid already installed: $(which ldid)"
            ldid -v || ldid --version || true
            exit 0
          fi

          if command -v brew >/dev/null 2>&1; then
            brew update
            if brew info ldid >/dev/null 2>&1; then
              brew install ldid
            else
              brew tap ProcursusTeam/tools
              brew install ldid
            fi
          fi

          if ! command -v ldid >/dev/null 2>&1; then
            echo "Falling back to direct ldid binary download"
            mkdir -p /usr/local/bin
            curl -fsSL -o /usr/local/bin/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid-macos
            chmod +x /usr/local/bin/ldid
          fi

          echo "ldid installed at: $(which ldid)"
          ldid -v || ldid --version || true

      - name: Build dylib
        run: |
          set -euo pipefail
          export THEOS=${{ github.workspace }}/theos
          export PYTHON_FRAMEWORK=${{ github.workspace }}/${{ env.PYXC }}/ios-arm64/Python.framework
          ls "$PYTHON_FRAMEWORK/Headers" | head -5
          make FINALPACKAGE=1 DEBUG=0

      - name: Package zip
        run: |
          set -euo pipefail
          DYLIB=$(find .theos/obj -name "SLNetEaseMC.dylib" | head -1)
          echo "dylib: $DYLIB"
          mkdir -p dist/SLNetEaseMC
          cp "$DYLIB" dist/SLNetEaseMC/
          cp -R resources dist/SLNetEaseMC/
          PYFW="${{ github.workspace }}/${{ env.PYXC }}/ios-arm64/Python.framework"
          if [ -d "$PYFW" ]; then
            mkdir -p dist/SLNetEaseMC/Frameworks
            cp -R "$PYFW" dist/SLNetEaseMC/Frameworks/
          fi
          cd dist && zip -q -r SLNetEaseMC.zip SLNetEaseMC
          ls -la SLNetEaseMC.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SLNetEaseMC
          path: dist/SLNetEaseMC.zip
