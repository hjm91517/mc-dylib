name: Unzip All and Deploy

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find, unzip, flatten single-folder, delete all ZIP files
        run: |
          shopt -s nullglob globstar
          found=0
          while IFS= read -r -d '' f; do
            echo "======================================"
            echo "解压：$f"
            dir=$(dirname "$f")
            unzip -o "$f" -d "$dir"

            # 检测 dir 下是否只有一个条目，且该条目是文件夹
            entries=( "$dir"/* )
            # 过滤掉刚解压出来的临时内容（含隐藏文件也要算）
            # 统计 dir 下非隐藏条目数
            visible_count=0
            only_folder=""
            for e in "$dir"/*; do
              [ -e "$e" ] || continue
              visible_count=$((visible_count + 1))
              only_folder="$e"
            done

            if [ "$visible_count" -eq 1 ] && [ -d "$only_folder" ]; then
              echo "检测到仅有一个文件夹：$only_folder，展开内容到 $dir"
              # 把该文件夹里的所有内容（含隐藏文件）移到上一级
              shopt -s dotglob
              mv "$only_folder"/* "$dir"/ 2>/dev/null || true
              shopt -u dotglob
              # 删除空文件夹
              rmdir "$only_folder" 2>/dev/null || true
            else
              echo "不是单文件夹结构，保持原样"
            fi

            rm -f "$f"
            found=1
          done < <(find . -type f -name '*.zip' -not -path './.git/*' -print0)

          if [ "$found" -eq 0 ]; then
            echo "没有找到 ZIP 文件"
            exit 0
          fi

          echo "---- 解压后仓库结构 ----"
          ls -la

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: unzip, flatten single folder, deploy"
            git push
          fi
