name: Build MCPlugin Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies & Theos
        run: |
          brew install ldid xz
          export THEOS=$HOME/theos
          rm -rf $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Build Dylib Only
        run: |
          export THEOS=$HOME/theos
          export PATH=$HOME/theos/bin:$PATH
          make clean || true
          make
        continue-on-error: false

      - name: Locate Dylib
        run: |
          echo "=== Searching for .dylib files ==="
          find . -name "*.dylib" -type f 2>/dev/null || true
          echo "=== Listing .theos/obj ==="
          ls -laR .theos/obj 2>/dev/null || true

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: dylib-output
          path: |
            .theos/obj/**/*.dylib
            .theos/obj/*.dylib
            **/*.dylib
          if-no-files-found: warn
