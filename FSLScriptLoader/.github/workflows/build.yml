name: Build FSLScriptLoader dylib

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          curl -L -o sdks.zip https://github.com/theos/sdks/archive/refs/heads/master.zip
          unzip -q sdks.zip
          cp -R sdks-master/*.sdk "$HOME/theos/sdks/" 2>/dev/null || cp -R sdks-master/sdks/*.sdk "$HOME/theos/sdks/"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          ls "$HOME/theos/sdks/"

      - name: Download Python iOS framework (for PY scripts)
        run: |
          URL=$(curl -s https://api.github.com/repos/beeware/Python-Apple-support/releases/latest \
            | python3 -c "import sys,json;assets=json.load(sys.stdin)['assets'];print(next(a['browser_download_url'] for a in assets if 'iOS' in a['name']))")
          echo "Python iOS support: $URL"
          curl -L "$URL" -o pyios.tar.gz
          mkdir -p pyios && tar -xzf pyios.tar.gz -C pyios
          XC=$(find pyios -maxdepth 4 -name "Python.xcframework" | head -1)
          mkdir -p Frameworks
          cp -R "$XC" Frameworks/
          ls Frameworks/Python.xcframework/

      - name: Build dylib
        run: make FINALPACKAGE=1 DEBUG=0

      - name: Package zip
        run: |
          DYLIB=$(find .theos/obj -name "FSLScriptLoader.dylib" | head -1)
          echo "dylib: $DYLIB"
          mkdir -p dist/FSLScriptLoader
          cp "$DYLIB" dist/FSLScriptLoader/
          mkdir -p dist/FSLScriptLoader/FSLResources.bundle
          cp Resources/* dist/FSLScriptLoader/FSLResources.bundle/ 2>/dev/null || true
          PYFW=$(find Frameworks/Python.xcframework -maxdepth 1 -type d -name "ios-arm64*" ! -name "*simulator*" | head -1)
          if [ -n "$PYFW" ]; then
            mkdir -p dist/FSLScriptLoader/Frameworks
            cp -R "$PYFW/Python.framework" dist/FSLScriptLoader/Frameworks/
          fi
          cd dist && zip -q -r FSLScriptLoader.zip FSLScriptLoader
          ls -la FSLScriptLoader.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FSLScriptLoader
          path: dist/FSLScriptLoader.zip
